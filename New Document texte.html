<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SmartArchive Animated Logo</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(circle at 20% 20%, rgba(126, 234, 255, 0.18), transparent 26%),
    radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.12), transparent 20%),
    linear-gradient(135deg, #022b6f, #0a69c5 55%, #1fc0ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
}

.logo-container {
  position: relative;
  width: 420px;
  height: 420px;
  filter: drop-shadow(0 28px 50px rgba(0, 0, 0, 0.26));
}

.logo-container::before {
  content: "";
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 76% 26%, rgba(255, 255, 255, 0.55), transparent 18%),
    radial-gradient(circle at 84% 44%, rgba(179, 236, 255, 0.18), transparent 22%);
  filter: blur(18px);
  animation: haloPulse 5.5s ease-in-out infinite;
}

.logo-circle {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 28% 22%, #9feeff 0%, #58caff 20%, transparent 38%),
    radial-gradient(circle at 72% 76%, rgba(4, 33, 95, 0.9), transparent 42%),
    linear-gradient(155deg, #72e6ff 0%, #1d8fff 44%, #0a48b7 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.4),
    inset -28px -36px 50px rgba(2, 23, 74, 0.28),
    0 30px 80px rgba(0,0,0,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.logo-circle::before {
  content: "";
  position: absolute;
  top: 7%;
  right: 10%;
  width: 110px;
  height: 180px;
  border-radius: 50%;
  background: linear-gradient(
    180deg,
    rgba(255, 255, 255, 0.72) 0%,
    rgba(255, 255, 255, 0.3) 35%,
    rgba(255, 255, 255, 0.05) 100%
  );
  filter: blur(6px);
  transform: rotate(18deg);
  mix-blend-mode: screen;
  opacity: 0.7;
}

.logo-circle::after {
  content: "";
  position: absolute;
  top: -22%;
  right: 10%;
  width: 44%;
  height: 140%;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(255, 255, 255, 0.08) 38%,
    rgba(255, 255, 255, 0.72) 50%,
    rgba(255, 255, 255, 0.12) 62%,
    transparent 100%
  );
  transform: rotate(22deg) translateX(160%);
  filter: blur(8px);
  opacity: 0.7;
  animation: sideShine 4.8s ease-in-out infinite;
}

.logo-text {
  position: relative;
  z-index: 2;
  font-size: 160px;
  font-weight: 800;
  color: white;
  letter-spacing: -0.04em;
  text-shadow:
    0 10px 20px rgba(0,0,0,0.2),
    0 0 28px rgba(255,255,255,0.14);
}

.sparkle {
  position: absolute;
  width: 42px;
  height: 42px;
  right: 48px;
  top: 64px;
  transform: rotate(45deg);
  opacity: 0;
  filter: drop-shadow(0 0 12px rgba(255,255,255,0.55));
  animation: sparkle 4.2s ease-in-out infinite;
}

.sparkle::before,
.sparkle::after {
  content: "";
  position: absolute;
  background: white;
  border-radius: 2px;
}

.sparkle::before {
  width: 100%;
  height: 5px;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
}

.sparkle::after {
  height: 100%;
  width: 5px;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
}

.sparkle-ring {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.38);
  opacity: 0;
  animation: sparkleRing 4.2s ease-in-out infinite;
}

@keyframes sparkle {
  0%   { opacity: 0; transform: rotate(45deg) scale(0.75) translateY(0); }
  18%  { opacity: 0.25; }
  36%  { opacity: 0.88; transform: rotate(45deg) scale(1.14) translateY(5px); }
  56%  { opacity: 0.58; }
  100% { opacity: 0; transform: rotate(45deg) scale(0.88) translateY(12px); }
}

@keyframes sparkleRing {
  0%   { opacity: 0; transform: scale(0.7); }
  35%  { opacity: 0.42; }
  100% { opacity: 0; transform: scale(1.65); }
}

@keyframes sideShine {
  0%, 18% {
    transform: rotate(22deg) translateX(160%);
    opacity: 0;
  }
  34% {
    opacity: 0.75;
  }
  52% {
    transform: rotate(22deg) translateX(18%);
    opacity: 0.92;
  }
  70% {
    opacity: 0.28;
  }
  100% {
    transform: rotate(22deg) translateX(-80%);
    opacity: 0;
  }
}

@keyframes haloPulse {
  0%, 100% {
    opacity: 0.6;
    transform: scale(0.98);
  }
  50% {
    opacity: 0.95;
    transform: scale(1.02);
  }
}
</style>
</head>
<body>

<div class="logo-container">
  <div class="logo-circle">
    <div class="logo-text">SA</div>
  </div>
  <div class="sparkle">
    <div class="sparkle-ring"></div>
  </div>
</div>

</body>
</html>
